# Every threshold for the 15m desk. Tunable per-asset clamps live in desk/engine/tunable.py.

assets:
  BTC:
    series: KXBTC15M
    coinbase: BTC-USD
    kraken: BTC/USD
    bitstamp: btcusd
    gemini: btcusd
    index: BRTI
  BNB:
    series: KXBNB15M
    coinbase: BNB-USD
    kraken: BNB/USD
    index: BNBUSD_RTI
  SOL:
    series: KXSOL15M
    coinbase: SOL-USD
    kraken: SOL/USD
    bitstamp: solusd
    gemini: solusd
    index: SOLUSD_RTI

composite:
  enabled_venues: [coinbase, kraken, bitstamp, gemini]
  drop_stale_venues: false
  stale_ms: 5000
  depth_window_secs: 60
  assets:
    BTC:
      venues: [coinbase, kraken, bitstamp, gemini]
    SOL:
      venues: [coinbase, kraken, bitstamp, gemini]
    BNB:
      venues: [coinbase, kraken]

feeds:
  index_poll_secs: 3
  stale_secs: 5
  vol_window_secs: 300
  baseline_window_secs: 1800
  flow_window_secs: 60
  momentum_window_secs: 60
  sample_keep_secs: 1800

fees:
  taker_rate: 0.07
  maker_rate: 0.0

model:
  effs_break: 60
  effs_offset: 40
  effs_cubic_div: 10800
  effs_floor: 0.5

chop:
  cushion_max: 45
  cushion_div: 2
  lag_points: 15
  lag_unknown: 7
  flow_max: 15
  flow_unknown: 5
  flow_scale: 15
  momentum_aligned: 10
  momentum_flat: 3
  momentum_against: 0
  crossings_0: 15
  crossings_1: 8
  crossings_2plus: 0
  real_min: 70
  mixed_min: 40

paper:
  enabled: true
  starting_balance: 1000
  max_entries_per_market: 1
  max_trade_usd: 20
  entry_cooldown_secs: 30
  require_gates: true
  min_net_edge_cents: 0
  require_positive_edge: true
  require_lag_side: false

suggest:
  exits_enabled: false
  exit_loss_frac: 0.42
  bank_price: 0.95
  bank_secs_left: 45
  entry_grace_secs: 75
  reverse_prob: 0.80
  reverse_secs_left: 60
  reverse_price_max: 0.90
  recover_prob: 0.35
  thin_prob: 0.55

# Strategy kinds + exit-only params. Entry tunables are per-asset (tunable.py).
strategies:
  gates_15m:
    label: 15m Gates
    kind: gates
    log_only: false
    params:
      trail_retrace: 0.09
      breakeven_after: 0.09
  spot_arb:
    label: Spot-to-event arb
    kind: arb
    log_only: false
    params:
      escape_price: 0.82
      hard_cap: 0.85
  sol_15m:
    label: SOL 15m
    kind: sol
    log_only: false
    params: {}
  sub25:
    label: Sub-25c scanner
    kind: scanner
    log_only: true
    params: {}
  weekend_money:
    label: THE WEEKEND MONEY
    kind: weekend_money
    log_only: false
    params:
      trail_retrace: 0.09
      breakeven_after: 0.09

# Modular 15m spot→Kalshi bot (paper / dry-run; does not replace legacy gates_15m entries).
modular_bot:
  enabled: true
  dry_run: true
  kill_switch: false
  hard_gates:
    secs_left_min: 60
    secs_left_max: 810
    ask_min_cents: 15
    ask_max_cents: 85
    max_spread_cents: 12
    min_net_edge_cents: -50
    one_entry_per_market: true
    ask_band_cents:
      BNB:
        min: 20
        max: 80
  risk:
    max_stake_usd: 20
    daily_loss_cap_usd: 200
    loss_streak_pause: 8
  soft_gates:
    trend_sigma_penalty_cents: 2
    momentum_penalty_cents: 1.5
    btc_confirm_enabled: true
  strategies:
    s1_stale_quote_lag:
      enabled: true
      lookback_s: 10
      min_move_sigma: 1.5
      max_repriced_frac: 0.35
    s2_fair_value_divergence:
      enabled: true
      min_divergence_cents: 4
    s3_settlement_lock:
      enabled: true
      secs_left_max: 360
      min_locked_fraction: 0.55
      min_cushion_sigmas: 1.2
    s4_cross_side_arb:
      enabled: true
    s5_cross_venue_divergence:
      enabled: false
    s6_fade:
      enabled: true
      min_kalshi_mid_move_cents: 3
    s7_consensus:
      enabled: true
      require_consensus: false
      min_agreeing: 2
