        const chartElement = document.getElementById('chart');

                timeVisible: true,
                secondsVisible: true,
            },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        const candleData = rawData.map(d => ({
            time: d.time, open: d.open, high: d.high, low: d.low, close: d.close
        }));
        candlestickSeries.setData(candleData);

        const strikeSeries = chart.addLineSeries({
            color: '#ff9800',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            title: 'Strike Level'
        });
        strikeSeries.setData(rawData.map(d => ({ time: d.time, value: d.strike })));

        const requiredSpotSeries = chart.addLineSeries({
            color: '#2962ff',
            lineWidth: 2,
            lineStyle: LightweightCharts.LineStyle.Solid,
            title: 'Required TWAP Spot'
        });
        requiredSpotSeries.setData(rawData.map(d => ({ time: d.time, value: d.required_spot })));

        const markers = [];
        rawData.forEach(d => {
            if (d.signal === 'buy') {
                markers.push({
                    time: d.time,
                    position: 'belowBar',
                    color: '#26a69a',
                    shape: 'arrowUp',
                    text: 'BUY EDGE'
                });
            } else if (d.signal === 'sell') {
                markers.push({
                    time: d.time,
                    position: 'aboveBar',
                    color: '#ef5350',
                    shape: 'arrowDown',
                    text: 'SELL EDGE'
                });
            }
        });
        candlestickSeries.setMarkers(markers);

        window.addEventListener('resize', () => {
